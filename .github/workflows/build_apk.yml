name: Build Ma Timer Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: stable
          cache: true
      - name: Generate native platforms
        run: |
          flutter create /tmp/ma_timer_native --platforms=android,ios --org com.matimer --project-name ma_timer
          rm -rf android ios
          cp -R /tmp/ma_timer_native/android android
          cp -R /tmp/ma_timer_native/ios ios
      - name: Configure Android build compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text().replace("minSdkVersion flutter.minSdkVersion","minSdkVersion 22")
          p.write_text(s)
          p=Path("android/build.gradle")
          s=p.read_text().replace("ext.kotlin_version = '1.7.10'","ext.kotlin_version = '1.9.0'")
          if "force all Kotlin modules to 1.9.0" not in s:
              s += "
allprojects { configurations.all { resolutionStrategy.eachDependency { d -> if (d.requested.group == 'org.jetbrains.kotlin') { d.useVersion '1.9.0' } } } }
"
          p.write_text(s)
          PY
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml");s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">')
          for x in ['    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>','    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>']:
              if x not in s:s=s.replace('<application',x+'\\n\\n    <application',1)
          s=s.replace('<application ','<application android:directBootAware="true" ',1);p.write_text(s)
          PY
      - run: printf "%s\n" "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" "android.useAndroidX=true" "android.enableJetifier=true" > android/gradle.properties
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: MaTimer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
