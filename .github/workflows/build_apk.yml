name: Build Ma Timer Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: stable
          cache: true

      - name: Generate native Flutter platforms
        shell: bash
        run: |
          rm -rf /tmp/ma_timer_native
          flutter create \
            --platforms=android,ios \
            --org com.matimer \
            --project-name ma_timer \
            --no-pub \
            /tmp/ma_timer_native
          rm -rf android ios
          cp -R /tmp/ma_timer_native/android ./android
          cp -R /tmp/ma_timer_native/ios ./ios

      - name: Configure Android manifest, SDK and Gradle memory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          if 'xmlns:tools=' not in s:
              s = s.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"'
              )

          permissions = '''    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          '''
          marker = '    <application'
          if 'android.permission.PACKAGE_USAGE_STATS' not in s:
              s = s.replace(marker, permissions + marker)

          if 'android:directBootAware=' not in s:
              s = s.replace(marker, '    <application android:directBootAware="true"', 1)

          s = s.replace('android:label="ma_timer"', 'android:label="Ma Timer"')
          manifest.write_text(s)

          app_gradle = Path("android/app/build.gradle")
          a = app_gradle.read_text()
          a = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 22', a)
          a = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 22', a)
          app_gradle.write_text(a)

          props = Path("android/gradle.properties")
          gs = props.read_text() if props.exists() else ""
          lines = [x for x in gs.splitlines() if not x.startswith("org.gradle.jvmargs=")]
          lines.append("org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m")
          props.write_text("\n".join(lines) + "\n")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaTimer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
